[package]
name = "twifip"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustfm-scrobble-proxy = "2.0.0"
attohttpc = "0.28.0"
serde_json = "1.0.116"
serde = { version = "1.0.199", features = ["derive"] }
tokio-cron-scheduler = { version = "0.13.0", features = ["signal"] }
log4rs = "1.3.0"
dotenvy = "0.15.7"
log = "0.4.25"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros", "time"] }