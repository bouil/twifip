[package]
name = "twifip"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
thiserror = "1.0"
rustfm-scrobble-proxy = "2.0"
attohttpc = "0.30"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio-cron-scheduler = { version = "0.15", features = ["signal"] }
log4rs = "1.4"
dotenvy = "0.15"
log = "0.4"
tokio = { version = "1.50", features = ["rt", "rt-multi-thread", "macros", "time"] }